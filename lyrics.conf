# =============================================================================
#  lyrics.conf - Conky window config for iShowLyrics
#  Author: iShowSomeone    Version: 1.0.1
#  Look and animation settings are in lyrics.lua; this file only controls the
#  window itself (position, size, frame rate).
#  `ishowlyrics config` rewrites several of these lines; keep the line format.
# =============================================================================

# — SETTINGS — #
background no
update_interval 0.016       # seconds per frame: 0.016 = ~60 fps, 0.025 = 40 fps, 0.033 = 30 fps
double_buffer yes           # required: prevents flicker
no_buffers yes
text_buffer_size 4096
imlib_cache_size 0

# — LUA — #
lua_load ~/iShowLyrics/lyrics.lua
lua_draw_hook_pre draw_lyrics

# — WINDOW — #
# The next two lines are changed by `ishowlyrics pin` / `ishowlyrics unpin`.
own_window yes
own_window_title iShowLyrics
own_window_class iShowLyrics
own_window_type desktop
own_window_transparent yes
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
own_window_argb_visual yes
own_window_argb_value 0

# — BORDER — #
border_inner_margin 1
border_outer_margin 1
border_width 1

# — SIZE — #
# Must be big enough for the largest font size and number of visible lines
# set in lyrics.lua. Too small and the text gets cut off.
minimum_size 620 350
maximum_width 620

# — ALIGNMENT / POSITION — #
# alignment: top_left tl, top_middle tm, top_right tr, middle_left ml,
#            middle_middle mm, middle_right mr, bottom_left bl,
#            bottom_middle bm, bottom_right br
# gap_x/gap_y: distance in pixels from that screen edge
alignment mr
gap_x 60
gap_y 0

# — GRAPHIC — #
draw_shades no
draw_outline no
draw_borders no
draw_graph_borders no

# — TEXT — #
use_xft yes
xftfont Dejavu Sans:size=8
xftalpha 1.0
uppercase no
override_utf8_locale yes
default_color 666

TEXT
${voffset 0}
